name: Publish

on:
  push:
    branches: [ master ]

jobs:
  publish:
    uses: CustomSpawnsTeam/workflows/.github/workflows/publish-common.yml@master
    with:
      mod_id: CalradiaAtWar
      workshop_id: 2878689343
      nexusmods_mod_id: "411"
      # TODO: replace with the Calradia at War file group (mod file) id
      nexusmods_file_group_id: REPLACE_WITH_CALRADIAATWAR_FILE_GROUP_ID
      # The Nexus archive carries Custom Spawns too, built from its master
      bundle_mod_id: CustomSpawns
    secrets:
      STEAM_WORKSHOP_LOGIN: ${{ secrets.STEAM_WORKSHOP_LOGIN }}
      STEAM_WORKSHOP_PASSWORD: ${{ secrets.STEAM_WORKSHOP_PASSWORD }}
      STEAM_WORKSHOP_AUTH_CODE: ${{ secrets.STEAM_WORKSHOP_AUTH_CODE }}
      NEXUSMODS_APIKEY: ${{ secrets.NEXUSMODS_APIKEY }}