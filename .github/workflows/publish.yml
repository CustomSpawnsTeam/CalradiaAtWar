name: Publish

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  publish:
    uses: CustomSpawnsTeam/workflows/.github/workflows/publish-common.yml@master
    with:
      mod_id: CalradiaAtWar
      workshop_id: 2878689343
      nexusmods_mod_id: "411"
      # The Nexus archive carries the Custom Spawns release that SubModule.xml depends on
      bundle_mod_id: CustomSpawns
    # Passes the repository and organisation secrets on, NEXUSMODS_APIKEY is an organisation secret
    secrets: inherit